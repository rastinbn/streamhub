version: "3.9"

# StreamHub - Development infrastructure
#
# Only stateful/infrastructure services run here. The Next.js and NestJS
# applications run directly on the host via `pnpm dev` for the best local
# dev experience (fast refresh, debugging, etc.).
#
# Usage: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: streamhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamhub}
      POSTGRES_DB: ${POSTGRES_DB:-streamhub}
    ports:
      - "5432:5432"
    volumes:
      - streamhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streamhub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: streamhub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - streamhub_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: streamhub-mediamtx
    restart: unless-stopped
    ports:
      - "1935:1935" # RTMP ingest (OBS publishes here)
      - "8888:8888" # HLS / Low-Latency HLS output (web player consumes here)
      - "9997:9997" # MediaMTX API (health/introspection)
    volumes:
      - ./infrastructure/streaming/mediamtx.yml:/mediamtx.yml:ro
    environment:
      # Where the NestJS API is reachable from inside this container. The
      # API runs on the host (via `pnpm dev`), not in Docker (see the note
      # at the top of this file) — `host.docker.internal` resolves to the
      # host machine on Docker Desktop (Mac/Windows) out of the box; the
      # `extra_hosts` entry below makes the same hostname work on Linux.
      MEDIAMTX_API_URL: ${MEDIAMTX_API_URL:-http://host.docker.internal:4000}
      # Must match the API's MEDIAMTX_WEBHOOK_SECRET env var — see
      # apps/api/src/common/guards/mediamtx-webhook.guard.ts.
      MEDIAMTX_WEBHOOK_SECRET: ${MEDIAMTX_WEBHOOK_SECRET:-dev-mediamtx-secret}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  streamhub_postgres_data:
  streamhub_redis_data:
