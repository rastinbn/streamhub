# StreamHub - MediaMTX configuration (MediaMTX v1.20.x)
#
# Responsibilities of this file:
#   - Accept RTMP publish connections from OBS (ingest)
#   - Serve HLS / Low-Latency HLS to the web player (playback)
#   - Delegate publish authorization to the NestJS API (see `authMethod` below)
#
# This server remains isolated from the NestJS API's business logic — it
# never validates users/channels/roles itself. The API is the authority:
#
#   PUBLISH AUTHORIZATION (authMethod: http)
#     Every publish attempt makes MediaMTX POST to the API's auth webhook
#     with `{action: "publish", path: "<streamKey>", ...}`. The API looks
#     the path up as a stream key (SHA-256 hash) and answers 20x = allow,
#     otherwise deny. Unknown/revoked keys and suspended channels are
#     therefore blocked at the RTMP level, not just cosmetically.
#
#     The `?secret=` query parameter on the auth URL authenticates the
#     callback itself (MediaMtxWebhookGuard) and must match
#     MEDIAMTX_WEBHOOK_SECRET on the API side. To change it, override the
#     whole URL with the MTX_AUTHHTTPADDRESS environment variable — MediaMTX
#     does NOT interpolate ${...} inside this file.
#
#   LIVE/ENDED STATE (no exec hooks on purpose)
#     The NestJS API polls the Control API below (`/v3/paths/list`) every
#     few seconds and reconciles Stream.status: a ready path whose key is
#     known becomes LIVE; a LIVE stream whose path disappears becomes
#     ENDED. This replaced the old runOnOnline/runOnOffline hooks, which
#     cannot work here: v1.x renamed/removed runOnPublish/runOnUnpublish,
#     and the official Docker image is distroless (no shell, no curl), so
#     exec-based hooks fail with `exec: "curl": executable file not found`.
#
# Consequence worth knowing: if the NestJS API is down, MediaMTX denies
# publishes and serves no HLS (it cannot ask the API for a decision). The
# API is deliberately the source of truth for who may broadcast.

logLevel: info
logDestinations: [stdout]

# ---------------------------------------------------------------------------
# RTMP ingest (OBS -> MediaMTX)
# ---------------------------------------------------------------------------
rtmp: yes
rtmpAddress: :1935

# ---------------------------------------------------------------------------
# HLS / Low-Latency HLS output (MediaMTX -> Web Player)
# ---------------------------------------------------------------------------
hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

# ---------------------------------------------------------------------------
# Control API (used by the NestJS API to reconcile live state via
# /v3/paths/list — authenticated through the same external auth flow below:
# user `streamhub` + MEDIAMTX_WEBHOOK_SECRET, or loopback access)
# ---------------------------------------------------------------------------
api: yes
apiAddress: :9997

# Other protocols left disabled (kept explicit for clarity)
rtsp: no
webrtc: no
srt: no

# ---------------------------------------------------------------------------
# Authentication — delegated to the NestJS API for every action
# (publish, read, playback, api, metrics, pprof). Payload:
#   {user, password, token, ip, action, path, protocol, id, query, userAgent}
# 20x response = allow, anything else = deny.
# ---------------------------------------------------------------------------
authMethod: http
authHTTPAddress: http://host.docker.internal:4000/api/v1/streams/webhooks/mediamtx/auth?secret=dev-mediamtx-secret

# Loopback-only Control API administrator (diagnostics from inside the
# container). The external auth above still decides for non-loopback API
# callers — the NestJS poller authenticates with streamhub:<webhook secret>.
authInternalUsers:
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
      - action: metrics
      - action: pprof

# ---------------------------------------------------------------------------
# Paths — `all_others` accepts a publish on any path (= any stream key) at
# the RTMP level; whether that publish is ALLOWED is decided by the external
# auth above, per key.
# ---------------------------------------------------------------------------
paths:
  all_others:
    source: publisher
