# StreamHub - Reverse proxy configuration (placeholder)
#
# Not wired into docker-compose.yml yet for local development, since Next.js
# and NestJS run directly on the host during Phase 1 (see root README).
# This file documents the intended production routing so the shape is ready
# ahead of a later deployment phase:
#
#   /            -> Next.js web app
#   /api/        -> NestJS API
#   /hls/        -> MediaMTX HLS output
#
# RTMP ingest (port 1935) is NOT proxied through Nginx/HTTP — OBS connects
# directly to the streaming server.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream web {
    server web:3000;
  }

  upstream api {
    server api:4000;
  }

  upstream streaming_hls {
    server mediamtx:8888;
  }

  server {
    listen 80;
    server_name _;

    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /hls/ {
      proxy_pass http://streaming_hls/;
      add_header Access-Control-Allow-Origin *;
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
